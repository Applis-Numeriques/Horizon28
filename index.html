/* ====== RENDU ====== */
const app=document.getElementById('app');
const ic=(n,z)=>`<img src="icons/${n}.svg" alt="" width="${z}" height="${z}">`;
const SHORT={prog:"Programmation et robotique",estime:"ESTIME",cyber:"Jeux déconnectés",partenaires:"Partenaires"};
const lab=a=>SHORT[a.id]||a.t;
const li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const home=()=>`
<header class="hero"><div class="wrap">
  <div class="brand"><div class="logo">horizon <b>28</b></div><div class="fse">Projet européen FSE+</div></div>
  <h1>Lutter contre le décrochage scolaire <span>par le numérique</span></h1>
  <p>Horizon 28 s’appuie sur le numérique pour prévenir le décrochage scolaire, améliorer le bien-être des élèves et renforcer le climat scolaire. Il développe les compétences du XXIème siècle (créativité, communication, collaboration, esprit critique) pour favoriser autonomie et persévérance.</p>
  <div class="zones"><em>Public : élèves du primaire et collégiens. Zones ciblées :</em><span>TER</span><span>REP</span><span>REP+</span></div>
  <button id="inst" type="button">Installer l’application</button>
</div></header>
<div class="wrap">
<section><h2>Les 3 axes du projet</h2><nav class="axes">
${AXES.map(a=>`<a class="axe" href="#/axe/${a.id}"><span class="tile">${ic(a.ico,46)}</span><span><small>${a.s}</small><strong>${a.t}</strong></span></a>`).join('')}
</nav></section>
<section><h2>Exemples d’actions à mener</h2><nav class="grid">
${ACTIONS.map(a=>`<a class="act" href="#/action/${a.id}"><span class="tile">${ic(a.ico,42)}</span><span class="lb">${lab(a)}</span></a>`).join('')}
</nav></section>
<section><div class="formbox"><h2>${FORM_TITLE}</h2><p>${FORM_TEXT}</p><a class="formbtn" href="${FORM_URL}" target="_blank" rel="noopener noreferrer">${FORM_BTN} ↗</a></div></section></div>`;
const axe=a=>`<div class="wrap"><a class="back" href="#/">‹ Accueil</a>
<div class="head"><span class="tile">${ic(a.ico,64)}</span><p class="tag">${a.s}</p><h1>${a.t}</h1><p>${a.intro}</p></div>
<div class="box"><h2>Ce que prévoit le projet</h2>${li(a.pts)}</div>
<div class="box"><h2>Actions pour y répondre</h2><div class="chips">${a.acts.map(i=>{const x=ACTIONS.find(y=>y.id===i);return `<a href="#/action/${i}">${ic(x.ico,22)} ${lab(x)}</a>`}).join('')}</div></div></div>`;
const action=a=>{const ax=AXES.filter(x=>x.acts.includes(a.id));return `<div class="wrap"><a class="back" href="#/">‹ Accueil</a>
<div class="head"><span class="tile">${ic(a.ico,64)}</span><h1>${a.t}</h1><p>${a.d}</p></div>
<div class="box"><h2>Objectifs pédagogiques</h2>${li(a.obj)}</div>
<div class="box"><h2>Lien avec Horizon 28</h2><p style="margin:0">${a.lien}</p>
<div class="chips" style="margin-top:12px">${ax.map(x=>`<a href="#/axe/${x.id}">${x.s} · ${x.t}</a>`).join('')}</div></div>
<div class="box"><h2>Matériel nécessaire</h2>${li(a.mat)}</div>
<div class="box"><h2>Fiches de séance clés en main</h2>${sea(a)}</div></div>`};
const sea=a=>(SEANCES[a.id]||[]).map(s=>`<details class="fiche"><summary>${s.t}<small>${s.m}</small></summary><h3>Objectifs pédagogiques</h3>${li(s.obj)}<h3>Déroulement</h3><ol>${s.e.map(x=>`<li><b>${x[0]}</b> · ${x[1]}</li>`).join('')}</ol>${s.c?`<h3>Conseils</h3>${li(s.c)}`:''}</details>`).join('');
function route(p){
  const [,k,id]=(typeof p==='string'?p:(location.hash||'#/')).split('/');
  const A=k==='axe'&&AXES.find(x=>x.id==id), B=k==='action'&&ACTIONS.find(x=>x.id===id);
  app.innerHTML=(A?axe(A):B?action(B):home()).replace(/ ([:;!?])/g,'&nbsp;$1');
  document.title=(A?A.s:B?B.t:'Horizon 28')+' – Horizon 28';
  window.scrollTo(0,0); bindInstall();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#/"]');if(!a)return;
  e.preventDefault();const h=a.getAttribute('href');
  try{history.pushState(null,'',h)}catch(_){}
  route(h);
});
window.addEventListener('popstate',()=>route());
window.addEventListener('hashchange',()=>route());
const m=document.getElementById('mail');m.href='mailto:'+CONTACT;m.textContent=CONTACT;
const q=document.getElementById('ask');q.href=QUESTION_URL;q.textContent='Poser une question en ligne ↗';

/* ====== INSTALLATION (PWA) ====== */
let dp=null;
function bindInstall(){const b=document.getElementById('inst');if(!b)return;
  if(dp)b.style.display='inline-block';
  b.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;b.style.display='none'}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;bindInstall()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
route();
</script>
</body>
</html>
