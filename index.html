function route(p){
  const [,k,id]=(typeof p==='string'?p:(location.hash||'#/')).split('/');

  window.scrollTo(0,0); bindInstall();
}

  e.preventDefault();const h=a.getAttribute('href');
  try{history.pushState(null,'',h)}catch(_){}
  route(h);
});

let dp=null;
function bindInstall(){const b=document.getElementById('inst');if(!b)return;
  if(dp)b.style.display='inline-block';
  b.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;b.style.display='none'}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;bindInstall()});
